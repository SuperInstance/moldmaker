# moldmaker-harness.yml — the interpretation-quality harness.
#
# Runs src/harness.py against the live interpreter (via the vault):
# four hard memos, mechanical expectations, a score. Manual dispatch
# only — run it whenever the interpreter prompt or the model changes.
# A red run is a finding: the report (job summary + artifact) names
# exactly which checks the current prompt/model combination fails.

name: moldmaker-harness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | jq -r '.value')
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Run the quality harness
        run: |
          set +e
          python3 src/harness.py --provider vault --out harness-report.md | tee harness-output.txt
          code=${PIPESTATUS[0]}
          cat harness-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "harness exit code: $code"
          exit $code

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness-report.md
