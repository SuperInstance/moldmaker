# moldmaker-think.yml — the think cycle (PROCESS.md §4).
#
# Two halves:
#   1. Deterministic (always): regenerate the spec views + meeting
#      agenda from the deposits and commit them if they changed.
#   2. LLM completeness pass (opt-in via the `llm` dispatch input):
#      src/think.py reads the whole spec set and writes
#      specs/THINK.md — gaps, contradictions, and proposed questions
#      for the user, every item traced to the deposits that motivated
#      it. THINK.md is a generated view of agent inferences, never a
#      deposit; it is labeled as such in the file itself.
#
# Manual dispatch only. To make it a heartbeat, add:
#   schedule:
#     - cron: '*/30 * * * *'
# under `on:` once a project store is live and the commit cadence is
# wanted.

name: moldmaker-think

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project store subdir (blank = dogfood)'
        required: false
        type: string
      llm:
        description: 'Also run the LLM completeness pass (specs/THINK.md)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  think:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate agenda + views
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          STORE="${PROJECT:-dogfood}"
          echo "STORE=$STORE" >> "$GITHUB_ENV"
          python3 - <<EOF
          import sys
          sys.path.insert(0, "src")
          import moldmaker
          store = "$STORE"
          moldmaker.init_store(store, commit=False)
          moldmaker.regenerate_views(store)
          with open(f"{store}/specs/AGENDA.md", "w") as f:
              f.write(moldmaker.render_agenda(store))
          print(moldmaker.status(store))
          EOF

      - name: Get OIDC token for vault
        if: ${{ inputs.llm }}
        # Mirrors moldmaker-telegram.yml's working pattern exactly:
        # raw token endpoint, audience "vault". (The first live think
        # run, 39681607533, failed vault verification with a 401 after
        # requesting a differently-named audience via github-script.)
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | jq -r '.value')
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: LLM completeness pass
        if: ${{ inputs.llm }}
        run: |
          python3 src/think.py "$STORE" --provider vault

      - name: Commit the think cycle
        run: |
          git config user.name "moldmaker"
          git config user.email "moldmaker@local"
          git add -A
          git diff --staged --quiet || git commit -m "think: agenda + views regenerated" \
            -m "Commentary: think cycle over $STORE. Deterministic regeneration always; the LLM completeness pass (specs/THINK.md — agent inferences traced to deposits, never deposits) ran only if dispatched with llm=true."
          git push
